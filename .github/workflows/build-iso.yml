name: Build CarsonOS Hybrid ISO

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build x86_64 BIOS + UEFI ISO
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso mtools

      - name: Validate package repository
        run: python3 tools/carpkg.py validate

      - name: Build kernel ELF
        run: |
          make clean
          make CROSS=x86_64-linux-gnu-

      - name: Fetch Limine binary release
        run: |
          set -eux
          mkdir -p limine
          curl -fL "https://github.com/Limine-Bootloader/Limine/releases/download/v12.11.1/limine-binary.tar.gz" -o /tmp/limine-binary.tar.gz
          tar -xzf /tmp/limine-binary.tar.gz -C limine

          LIMINE_SYS="$(find limine -type f -name limine-bios.sys -print -quit)"
          test -n "$LIMINE_SYS"
          LIMINE_DIR="$(dirname "$LIMINE_SYS")"
          echo "LIMINE_DIR=$LIMINE_DIR" >> "$GITHUB_ENV"
          make -C "$LIMINE_DIR"

      - name: Assemble bootable ISO with package repository
        run: |
          set -eux
          python3 tools/carpkg.py build-iso --kernel build/kernel.elf --limine-dir "$LIMINE_DIR" --output CarsonOS-Hybrid-x86_64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarsonOS-Hybrid-x86_64-ISO
          path: CarsonOS-Hybrid-x86_64.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
